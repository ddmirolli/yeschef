name: Site

on:
  pull_request:
    paths:
      - 'site/**'
      - 'deploy/yeschef/**'
      - '.github/workflows/site.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'deploy/yeschef/**'
      - '.github/workflows/site.yml'

permissions:
  contents: read

jobs:
  site:
    name: Astro, TypeScript, and site tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install the locked site dependencies
        run: npm ci --prefix site
      - name: Check types and build the static site
        run: npm run build --prefix site
      - name: Test downloads, demo isolation, and built pages
        run: npm test --prefix site
      - name: Check public files
        run: python3 -m unittest test_public.py
