<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The Nightly build's Dock icon: the Stable icon's cloche (icon.svg), same size and place, on a night tile with
       three stars, so a Nightly build never looks like Stable in the Dock. Rendered to icon-nightly.png at 1024 with
       `rsvg-convert -w 1024 -h 1024 icon-nightly.svg -o icon-nightly.png`. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A3AB8"/>
      <stop offset="1" stop-color="#1C1458"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <g fill="#fff">
    <path d="M282 196Q282 246 332 246Q282 246 282 296Q282 246 232 246Q282 246 282 196Z"/>
    <path d="M748 236Q748 266 778 266Q748 266 748 296Q748 266 718 266Q748 266 748 236Z" opacity=".85"/>
    <path d="M818 372Q818 388 834 388Q818 388 818 404Q818 388 802 388Q818 388 818 372Z" opacity=".7"/>
  </g>
  <g transform="translate(137.9 104.3) scale(31.178)" fill="#fff"><path d="M4.25 17.4a7.75 7.75 0 0 1 15.5 0" fill="none" stroke="#fff" stroke-width="1.5"/><circle cx="12" cy="7.4" r="1.75"/><path d="M2.75 19h18.5l-1.5 1.5H4.25z"/></g>
</svg>
