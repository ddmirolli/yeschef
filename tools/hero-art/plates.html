<!doctype html>
<!-- The before and after shots on the made-up "Retry failed payouts" ticket (payouts-*.png in this folder), which
     the site demo shows: tools/site_demo.mjs copies them to site/demo/img/. Drawn by service.js, the site's old
     "Run the pass" demo, kept in this folder for them, and saved as PNG, because the app shows only raster
     screenshots. To redraw: serve a folder holding this page as index.html, service.js and
     site/fonts/figtree-latin-var.woff2 (under fonts/), shoot each #<theme>-<before|after> with tools/shoot.sh
     ({"shotOf": "#dark-before", "as": "payouts-before-dark"}), copy the PNGs here, then run node tools/site_demo.mjs. -->
<html lang="en"><head><meta charset="utf-8"><title>Plates</title>
<style>
@font-face { font-family: "Figtree"; font-weight: 300 900; src: url("fonts/figtree-latin-var.woff2") format("woff2"); }
body { margin: 0; padding: 20px; background: #777; display: grid; gap: 20px; }
/* The app shows a shot in a frame about 370 x 340: crop to the page body and pad with the plate's own background. */
.plate { width: 960px; height: 881px; }
.plate svg { display: block; width: 100%; height: 100%; }
</style></head><body>
<div class="plate" id="dark-before"></div><div class="plate" id="dark-after"></div>
<div class="plate" id="light-before"></div><div class="plate" id="light-after"></div>
<script>
const DISH = 'Retry failed payouts';
(async () => {
  // Lift the menu and the plate drawing out of service.js unchanged.
  const src = await (await fetch('service.js')).text();
  const menu = src.slice(src.indexOf('var DISHES'), src.indexOf('\n  };\n', src.indexOf('var DISHES')) + 5);
  const draw = src.slice(src.indexOf('var THEMES'), src.indexOf('/* The sheet.'));
  const { screen, DISHES } = new Function(menu + draw + 'return { screen: screen, DISHES: DISHES };')();
  await document.fonts.load('600 11px Figtree');
  for (const theme of ['dark', 'light']) for (const which of ['before', 'after']) {
    const el = document.getElementById(theme + '-' + which);
    el.innerHTML = screen(DISHES[DISH], which, theme);
    el.style.background = el.querySelector('rect').getAttribute('fill');   // the plate's page colour
    el.querySelector('svg').setAttribute('viewBox', '128 -90 512 470');   // the page body, no side bar
  }
  document.body.dataset.ready = '1';
})();
</script>
</body></html>
