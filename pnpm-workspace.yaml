# The workspace, as T3 Code sets it up (Dan, 2026-11-10, "1. C": T3's TypeScript and tools).
# site/ keeps its own npm install for the Cloudflare build.
packages:
  - client
  - desktop
  - relay
  - spikes
  - tools

# Build scripts pnpm may run, as in T3 Code. electron-winstaller is electron-builder's Windows installer, which Yes Chef
# never builds. Electron 45 has no install script: it downloads its binary on first start (npm start or capture).
allowBuilds:
  electron-winstaller: false

catalog:
  "@cloudflare/workers-types": 4.20260702.1
  "@types/node": 24.12.4
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0

overrides:
  vite: "catalog:"
  vite-plus: "catalog:"

# Unmet peers fail resolution, as in T3 Code.
strictPeerDependencies: true

peerDependencyRules:
  allowAny:
    - typescript
    - vite
  allowedVersions:
    vite: "*"
